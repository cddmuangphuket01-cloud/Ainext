name: Ainext OpenRouter UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GPT provider UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("label:'OpenAI GPT-4o mini'", "label:'OpenRouter GPT (ฟรี)'"),
            ("org:'OpenAI', model:'gpt-4o-mini'", "org:'OpenRouter', model:'openai/gpt-oss-20b:free'"),
            ("endpoint:'https://api.openai.com/v1/chat/completions'", "endpoint:'https://openrouter.ai/api/v1/chat/completions'"),
            ("AI Key ของ OpenAI", "API Key ของ OpenRouter"),
            ("OpenAI API Key", "OpenRouter API Key"),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit UI update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update GPT provider to OpenRouter UI [skip ci]"
          git push
