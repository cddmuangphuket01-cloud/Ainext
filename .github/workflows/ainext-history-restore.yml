name: Enable Ainext chat history restore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject history restore script
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')

          s = p.read_text(encoding='utf-8')
          tag = '<script src="./ainext-history-restore.js"></script>'

          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html: closing body tag not found')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit injection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ainext-history-restore.js .github/workflows/ainext-history-restore.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix chat history restore after refresh [skip ci]"
          git push
