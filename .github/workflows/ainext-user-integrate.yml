name: Ainext User Persistence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Ainext runtime modules
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '</body>' not in s:
              raise SystemExit('index.html: closing body tag not found')
          tags = [
              '<script src="./ainext-user-data.js"></script>',
              '<script src="./ainext-user-admin.js"></script>',
              '<script src="./ainext-runtime-hardening.js"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ainext-user-data.js ainext-user-admin.js ainext-runtime-hardening.js .github/workflows/ainext-user-integrate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Ainext database user management and security hardening [skip ci]"
          git push
